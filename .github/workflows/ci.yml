# Roda a cada push e pull request: compila o front, compila a API e roda os testes das regras de negócio.
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
